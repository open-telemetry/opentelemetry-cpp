# Exercises the composite/development sampler builder types.
#
# The Registry provides one builder per SDK component type. Each builder constructs its component from the parsed configuration model.
# RegistryFactory::Create() pre-loads all the SDK default builders shown in this file.
# Call Set*Builder() on the Registry to swap in your own implementation before calling ConfiguredSdk::Create:
#
#   auto registry = RegistryFactory::Create();
#   registry->SetComposableRuleBasedSamplerBuilder(std::make_unique<MyComposableRuleBasedSamplerBuilder>());
#   auto sdk = ConfiguredSdk::Create(registry, model);

file_format: "1.0"
log_level: info

tracer_provider:
  processors:
    - simple:  # SimpleSpanProcessorBuilder
        exporter:
          console:  # ConsoleSpanExporterBuilder
  sampler:
    parent_based:  # ParentBasedSamplerBuilder
      root:
        composite/development:
          rule_based:  # ComposableRuleBasedSamplerBuilder
            rules:
              - attribute_values:
                  key: http.method
                  values:
                    - GET
                    - POST
                attribute_patterns:
                  key: http.url
                  included:
                    - .*/api/.*
                  excluded:
                    - .*/healthz
                parent:
                  - remote
                  - local
                span_kinds:
                  - server
                  - client
                sampler:
                  always_on:
              - sampler:
                  always_off:
      remote_parent_sampled:
        composite/development:
          always_on:  # ComposableAlwaysOnSamplerBuilder
      remote_parent_not_sampled:
        composite/development:
          always_off:  # ComposableAlwaysOffSamplerBuilder
      local_parent_sampled:
        composite/development:
          probability:  # ComposableProbabilitySamplerBuilder
            ratio: 0.5
      local_parent_not_sampled:
        composite/development:
          parent_threshold:  # ComposableParentThresholdSamplerBuilder
            root:
              probability:
                ratio: 0.1
