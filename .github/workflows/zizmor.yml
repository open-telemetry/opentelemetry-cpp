name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '14 19 * * 4' # weekly at 19:14 UTC on Thursday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@ee32c419ea90b05286c0cdc24538d970992cf82a # v0.11.0
