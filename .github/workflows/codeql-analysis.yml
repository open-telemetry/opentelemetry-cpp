name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]

permissions:
  contents: read

jobs:
  CodeQL-Build:
    permissions:
      actions: read  # for github/codeql-action/init to get workflow details
      contents: read  # for actions/checkout to fetch code
      security-events: write  # for github/codeql-action/autobuild to send a status report
    runs-on: ubuntu-latest
    env:
      CC: /usr/bin/gcc-14
      CXX: /usr/bin/g++-14
      CXX_STANDARD: '17'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
         persist-credentials: false
         submodules: 'recursive'
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y --no-install-recommends --no-install-suggests \
          build-essential \
          cmake \
          ninja-build \
          gcc-14 \
          g++-14 \
          zlib1g-dev \
          libssl-dev \
          libcurl4-openssl-dev \
          nlohmann-json3-dev \
          libabsl-dev \
          libprotobuf-dev \
          libgrpc++-dev \
          protobuf-compiler \
          protobuf-compiler-grpc \
          libgmock-dev \
          libgtest-dev \
          libbenchmark-dev
    - name: Install rapidyaml
      run: |
        sudo -E ./ci/install_thirdparty.sh --install-dir /usr/local --tags-file third_party_release --packages "ryml"
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: cpp
        config: |
          paths-ignore:
            - third_party
    - name: Build (abiv2)
      run: |
        mkdir -p $HOME/build && cd $HOME/build
        cmake -G Ninja \
              -C ${GITHUB_WORKSPACE}/test_common/cmake/all-options-abiv2-preview.cmake \
              -DOTELCPP_WITH_OPENTRACING=OFF \
              "${GITHUB_WORKSPACE}"
        cmake --build . --parallel
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
